<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadeautjes trekken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --snow: #F2F5F9;
    --paper: #FFFFFF;
    --ink: #17233B;
    --ink-soft: #55627A;
    --line: #D5DCE8;
    --ribbon: #D62839;
    --ribbon-dark: #A81C2B;
    --gold: #F2B134;
    --ok: #1F7A4D;
    --radius: 14px;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--snow);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
  }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
  h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
  h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); font-weight: 800; }
  h2 { font-size: 1.6rem; font-weight: 700; }
  p { margin: 0; }
  .muted { color: var(--ink-soft); }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* Kerst */
  body { position: relative; min-height: 100vh; }
  .garland { position: absolute; top: 0; left: 0; right: 0; height: 56px; pointer-events: none; z-index: 2;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='56' viewBox='0 0 100 56'><path d='M0 4 Q50 22 100 4' fill='none' stroke='%23556' stroke-width='2'/><rect x='18' y='9' width='4' height='5' fill='%23F2B134'/><circle cx='20' cy='21' r='7.5' fill='%23D62839'/><circle cx='17.5' cy='18.5' r='2' fill='%23fff' fill-opacity='.45'/><rect x='48' y='12' width='4' height='5' fill='%23B8860B'/><circle cx='50' cy='24' r='7.5' fill='%23F2B134'/><circle cx='47.5' cy='21.5' r='2' fill='%23fff' fill-opacity='.55'/><rect x='78' y='9' width='4' height='5' fill='%23F2B134'/><circle cx='80' cy='21' r='7.5' fill='%232E8B57'/><circle cx='77.5' cy='18.5' r='2' fill='%23fff' fill-opacity='.45'/></svg>") repeat-x top center; }
  main { position: relative; z-index: 1; padding-top: 64px; }
  .deco { margin-top: 56px; text-align: center; font-size: clamp(1.6rem, 5vw, 2.4rem); letter-spacing: .35em; user-select: none; }
  .deco span { display: inline-block; }
  .deco span:nth-child(odd) { animation: wiggle 3.2s ease-in-out infinite; }
  .deco span:nth-child(even) { animation: wiggle 3.8s ease-in-out infinite reverse; }
  @keyframes wiggle { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .tile .ico { position: absolute; top: 10px; right: 12px; font-size: 1.5rem; }
  .empty .big { font-size: 2.4rem; margin-bottom: 6px; }

  /* Inlogpagina: winternacht met sneeuw */
  body.night { background: linear-gradient(180deg, #0d1830 0%, #1c3557 70%, #29476f 100%); }
  body.night::after { content: ""; position: fixed; left: -5%; right: -5%; bottom: -46px; height: 96px; background: #fff; border-radius: 50% 50% 0 0; box-shadow: 0 -6px 30px rgba(255,255,255,.35); z-index: 0; pointer-events: none; }
  .night .brand { color: var(--gold); }
  .night .muted, .night .linklike { color: #c9d6ea; }
  .hero { text-align: center; margin: 6px 0 26px; }
  .hero h1 { font-size: clamp(2.6rem, 11vw, 5.6rem); line-height: 1; color: #fff;
    text-shadow: 0 3px 0 var(--ribbon), 0 7px 0 var(--ribbon-dark), 0 14px 28px rgba(0,0,0,.4); }
  .hero .emojis { font-size: clamp(2rem, 7vw, 3.2rem); margin-top: 16px; letter-spacing: .25em; }
  .login-title { text-align: center; color: #fff; }
  .night .intro { color: #dbe4f3; margin-left: auto; margin-right: auto; text-align: center; }
  .login-card { max-width: 460px; margin: 0 auto; color: var(--ink); }
  #snow { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  #snow span { position: absolute; top: -20px; background: #fff; border-radius: 50%; animation: fall linear infinite; }
  @keyframes fall {
    0% { transform: translate(0, -5vh); }
    50% { transform: translate(var(--sway), 50vh); }
    100% { transform: translate(calc(var(--sway) * -1), 105vh); }
  }

  /* Header */
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 1.15rem; color: var(--ribbon); }
  .linklike { background: none; border: 0; padding: 0; font: inherit; color: var(--ink-soft); text-decoration: underline; cursor: pointer; }

  /* Panels */
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; }
  .intro { margin: 10px 0 24px; max-width: 56ch; color: var(--ink-soft); }

  /* Form controls */
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=number] {
    width: 100%; font: inherit; color: var(--ink);
    padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
  }
  input:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px rgba(242,177,52,.55); }
  button.primary {
    font: inherit; font-weight: 700; font-family: var(--display);
    background: var(--ribbon); color: #fff; border: 0; border-radius: 10px;
    padding: 13px 22px; cursor: pointer; font-size: 1.05rem;
  }
  button.primary:hover { background: var(--ribbon-dark); }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }

  .gift-row { display: grid; grid-template-columns: 1fr 140px; gap: 12px; margin-bottom: 16px; }
  .gift-row .price-wrap { position: relative; }
  .gift-row .price-wrap span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
  .gift-row .price-wrap input { padding-left: 30px; }
  .gift-row .row-label { grid-column: 1 / -1; margin-bottom: -6px; }
  .hint { font-size: .92rem; color: var(--ink-soft); margin-top: 4px; }

  /* Status */
  .counter { display: flex; gap: 8px; align-items: center; margin: 14px 0 0; }
  .pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: transparent; }
  .pip.on { background: var(--ribbon); border-color: var(--ribbon); }

  section.block { margin-top: 44px; }
  section.block > .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

  /* Revealed picks */
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .pick {
    background: var(--paper); border: 2px solid var(--gold); border-radius: var(--radius);
    padding: 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 130px;
  }
  .pick .t { font-family: var(--display); font-weight: 700; font-size: 1.25rem; line-height: 1.2; overflow-wrap: anywhere; }
  .pick .for { font-size: .95rem; color: var(--ink-soft); }
  .pick .for strong { color: var(--ink); }
  .pick .p { font-weight: 600; color: var(--ok); }
  .pick.reveal .t, .pick.reveal .p { animation: unblur .9s ease-out both; }
  @keyframes unblur { from { filter: blur(12px); opacity: .2; } to { filter: blur(0); opacity: 1; } }

  /* Blurred tiles */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .tile {
    position: relative; overflow: hidden; text-align: left; font: inherit; color: var(--ink);
    background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 18px; min-height: 130px; cursor: pointer;
    transition: transform .15s ease, border-color .15s ease;
  }
  .tile:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--ribbon); }
  .tile:disabled { cursor: not-allowed; opacity: .55; }
  .tile .fuzzy { filter: blur(7px); user-select: none; pointer-events: none; }
  .tile .fuzzy .t { font-family: var(--display); font-weight: 700; font-size: 1.1rem; }
  .tile .fuzzy .p { margin-top: 10px; font-weight: 600; }
  .tile .tag {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: .82rem; font-weight: 600;
    padding: 4px 12px; border-radius: 999px; white-space: nowrap;
  }
  .tile.busy { opacity: .6; pointer-events: none; }

  .empty { padding: 28px; border: 2px dashed var(--line); border-radius: var(--radius); color: var(--ink-soft); text-align: center; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 10px; max-width: min(92vw, 460px);
    transition: opacity .2s ease, transform .2s ease; pointer-events: none; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.error { background: var(--ribbon-dark); }

  /* Link zoeken */
  .gift-row .link-line { grid-column: 1 / -1; }
  .pick .buy { display: inline-block; margin-top: 8px; font-weight: 600; color: var(--ribbon-dark); }

  .tile.extra { border-style: dashed; border-color: var(--gold); border-width: 2px; }

  /* Beheerder */
  .warn { margin-top: 8px; padding: 8px 12px; background: #FFF4D6; border: 1.5px solid var(--gold); border-radius: 8px; color: var(--ink); }
  .phase { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  button.secondary { font: inherit; font-weight: 600; background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 10px; padding: 10px 16px; cursor: pointer; white-space: nowrap; }
  button.secondary:hover { background: var(--ink); color: #fff; }
  .table-wrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-family: var(--display); font-weight: 700; background: var(--snow); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td ul { margin: 0; padding-left: 18px; }
  .danger { font: inherit; font-weight: 600; color: var(--ribbon-dark); background: none; border: 1.5px solid var(--ribbon); border-radius: 8px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .danger:hover { background: var(--ribbon); color: #fff; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 14px; }
  .stats strong { font-family: var(--display); font-size: 1.5rem; }

  .setup-warning { background: #FFF4D6; border: 1.5px solid var(--gold); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; }

  @media (max-width: 520px) {
    .gift-row { grid-template-columns: 1fr; }
    .panel { padding: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #snow { display: none; }
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="garland" aria-hidden="true"></div>
<main>
  <div class="top">
    <span class="brand">🎄 Kerst met de familie</span>
    <span id="whoami"></span>
  </div>
  <div id="app"></div>
  <div class="deco" aria-hidden="true"><span>🎅</span><span>🦌</span><span>🎁</span><span>☕</span><span>🧦</span><span>⛄</span><span>🎄</span></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, collection, onSnapshot,
    writeBatch, runTransaction, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Firebase-configuratie van project "kerstlijstje"
  const firebaseConfig = {
    apiKey: "AIzaSyB7ZA9dBU8wAElR3rMt2Rf607sFsmR1WXI",
    authDomain: "kerstlijstje-f45c3.firebaseapp.com",
    databaseURL: "https://kerstlijstje-f45c3-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "kerstlijstje-f45c3",
    storageBucket: "kerstlijstje-f45c3.firebasestorage.app",
    messagingSenderId: "1065905360166",
    appId: "1:1065905360166:web:1bd05b667e4f6ae4f385e7"
  };

  const MIN_PRICE = 10;
  const MAX_PRICE = 25;
  const ITEMS_TO_SUBMIT = 5;
  const ITEMS_TO_PICK = 3;

  // Deze deelnemers (op naam; hoofdletters en accenten maken niet uit) mogen cadeaus aandragen, maar kiezen zelf niet.
  // Andere deelnemers onthullen voor hen de cadeaus die zij kopen.
  const NO_PICK = ["rosalie", "sander"];
  const isExempt = (id) => NO_PICK.includes(id);
  const isDistributed = () => items.some((i) => i.assignedToId);

  // ── Verdeling ─────────────────────────────────────────────────
  // Kiest per deelnemer K van de aangedragen cadeaus (die deelnemer ontvangt er dus K) en verdeelt die over
  // de kopers. Kopers zijn alle deelnemers die zelf kiezen. Elke koper koopt K cadeaus van andere kopers,
  // plus (ongeveer) 1 extra cadeau voor de deelnemers die niet kiezen (zij kopen zelf niets).
  // Niemand koopt een eigen cadeau en de totaalbedragen per koper zijn zo gelijk mogelijk.
  // Simulated annealing met een paar herstarts.
  function computeDistribution(allItems, people, K, exemptIds) {
    const exempt = new Set(exemptIds);
    const owners = people;
    const buyers = people.filter((p) => !exempt.has(p.id));
    const O = owners.length, B = buyers.length;
    if (B < 2) return { error: "Er zijn minstens 2 deelnemers nodig die zelf kiezen." };
    const its = owners.map((o) => allItems.filter((i) => i.ownerId === o.id));
    for (let o = 0; o < O; o++) {
      if (its[o].length < K) return { error: `${owners[o].name} heeft minder dan ${K} cadeaus aangedragen.` };
    }
    const buyerIdx = new Map(buyers.map((b, i) => [b.id, i]));
    const ownerBuyer = owners.map((o) => (buyerIdx.has(o.id) ? buyerIdx.get(o.id) : -1)); // -1: koopt zelf niets
    const DUP = 400; // straf als iemand twee cadeaus van dezelfde persoon moet kopen

    const randInt = (n) => Math.floor(Math.random() * n);
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    const regSlots = [], extraSlots = [];
    for (let o = 0; o < O; o++) for (let k = 0; k < K; k++) (ownerBuyer[o] >= 0 ? regSlots : extraSlots).push([o, k]);
    extraSlots.sort((x, y) => x[1] - y[1] || x[0] - y[0]);

    function initial() {
      const sel = [], dest = [];
      for (let o = 0; o < O; o++) { sel[o] = shuffle([...Array(its[o].length).keys()]).slice(0, K); dest[o] = new Array(K); }
      const perm = shuffle([...Array(B).keys()]);
      const inv = new Array(B); perm.forEach((b, q) => { inv[b] = q; });
      for (let o = 0; o < O; o++) {
        if (ownerBuyer[o] < 0) continue;
        const q = inv[ownerBuyer[o]];
        for (let k = 0; k < K; k++) dest[o][k] = perm[(q - (1 + (k % (B - 1))) + B * K) % B];
      }
      const order = shuffle([...Array(B).keys()]);
      extraSlots.forEach(([o, k], t) => { dest[o][k] = order[t % B]; });
      return { sel, dest };
    }

    const cnt = new Int8Array(B * O);
    const tot = new Float64Array(B);
    function cost(st) {
      tot.fill(0); cnt.fill(0);
      let dup = 0;
      for (let o = 0; o < O; o++) {
        for (let k = 0; k < K; k++) {
          const b = st.dest[o][k];
          tot[b] += its[o][st.sel[o][k]].price;
          if (++cnt[b * O + o] > 1) dup++;
        }
      }
      let mean = 0; for (let b = 0; b < B; b++) mean += tot[b]; mean /= B;
      let v = 0; for (let b = 0; b < B; b++) v += (tot[b] - mean) * (tot[b] - mean);
      return v + DUP * dup;
    }

    let best = null, bestCost = Infinity;
    const RESTARTS = 6, ITER = 40000;
    for (let r = 0; r < RESTARTS; r++) {
      const st = initial();
      let c = cost(st);
      const T0 = 30, T1 = 0.02;
      for (let it = 0; it < ITER; it++) {
        const T = T0 * Math.pow(T1 / T0, it / ITER);
        let undo = null;
        const x = Math.random();
        if (x < 0.55) {
          const useExtra = extraSlots.length > 1 && Math.random() < extraSlots.length / (extraSlots.length + regSlots.length);
          const pool = useExtra ? extraSlots : regSlots;
          const [o1, k1] = pool[randInt(pool.length)], [o2, k2] = pool[randInt(pool.length)];
          if (o1 === o2 && k1 === k2) continue;
          const b1 = st.dest[o1][k1], b2 = st.dest[o2][k2];
          if (b1 === b2) continue;
          if (!useExtra && (b2 === ownerBuyer[o1] || b1 === ownerBuyer[o2])) continue;
          st.dest[o1][k1] = b2; st.dest[o2][k2] = b1;
          undo = () => { st.dest[o1][k1] = b1; st.dest[o2][k2] = b2; };
        } else {
          const o = randInt(O), k = randInt(K);
          if (its[o].length <= K) continue;
          let u; do { u = randInt(its[o].length); } while (st.sel[o].includes(u));
          const old = st.sel[o][k];
          st.sel[o][k] = u;
          undo = () => { st.sel[o][k] = old; };
        }
        const nc = cost(st);
        if (nc <= c || Math.random() < Math.exp((c - nc) / T)) {
          c = nc;
          if (c < bestCost) { bestCost = c; best = { sel: st.sel.map((a) => [...a]), dest: st.dest.map((a) => [...a]) }; }
        } else undo();
      }
      if (!best) { best = { sel: st.sel.map((a) => [...a]), dest: st.dest.map((a) => [...a]) }; bestCost = c; }
    }

    const assignments = []; // { itemId, ownerId, buyerId, revealerId }
    const totals = {};
    buyers.forEach((b) => { totals[b.id] = 0; });
    for (let o = 0; o < O; o++) {
      for (let k = 0; k < K; k++) {
        const item = its[o][best.sel[o][k]];
        const buyer = buyers[best.dest[o][k]];
        assignments.push({ itemId: item.id, ownerId: owners[o].id, buyerId: buyer.id, revealerId: buyer.id });
        totals[buyer.id] += item.price;
      }
    }
    return { assignments, totals, cost: bestCost };
  }

  const app = document.getElementById("app");
  const whoami = document.getElementById("whoami");
  const toastEl = document.getElementById("toast");

  const configured = !firebaseConfig.apiKey.startsWith("JOUW_");
  let db = null;
  if (configured) {
    db = getFirestore(initializeApp(firebaseConfig));
  }

  // ── State ────────────────────────────────────────────────────
  let me = null;               // { id, name }
  let myDoc = null;            // participants/{id}
  let items = [];              // alle items
  let unsubs = [];
  let currentView = null;
  let busyItem = null;
  let phase = "submit";        // settings/game.phase: "submit" (aandragen) of "pick" (kiezen)
  const seenPicks = new Set();
  let firstPickRender = true;

  // ── Helpers ──────────────────────────────────────────────────
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ICONS = ["🎁", "🧦", "🎄", "⭐", "🔔", "🍬", "🦌"];

  function setScene(login) {
    document.body.classList.toggle("night", login);
    const old = document.getElementById("snow");
    if (old) old.remove();
    if (!login) return;
    const box = document.createElement("div");
    box.id = "snow";
    box.setAttribute("aria-hidden", "true");
    for (let i = 0; i < 70; i++) {
      const f = document.createElement("span");
      const size = 4 + Math.random() * 10;
      f.style.cssText = `left:${(Math.random() * 100).toFixed(1)}%;width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;` +
        `animation-duration:${(8 + Math.random() * 12).toFixed(1)}s;animation-delay:${(-Math.random() * 20).toFixed(1)}s;` +
        `opacity:${(0.5 + Math.random() * 0.5).toFixed(2)};--sway:${Math.round(Math.random() * 80 - 40)}px`;
      box.appendChild(f);
    }
    document.body.appendChild(box);
  }

  const safeLink = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
  const euro = (n) => "€ " + Number(n).toFixed(2).replace(".", ",");
  const slug = (name) => name.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  let toastTimer;
  function toast(msg, isError = false) {
    toastEl.textContent = msg;
    toastEl.className = "show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = ""; }, 4200);
  }

  // Neutrale vulteksten: de echte tekst komt pas in de pagina nadat het item is gekozen
  const FILLER = [
    "Een leuk cadeau om uit te pakken",
    "Verrassing voor jou",
    "Nog even geheim houden",
    "Wat zou hier staan",
    "Pak maar uit",
    "Een cadeautje met een mysterie"
  ];

  // ── Start ────────────────────────────────────────────────────
  function boot() {
    if (!configured) {
      app.innerHTML = `
        <div class="setup-warning">
          <strong>Firebase is nog niet gekoppeld.</strong>
          Vul bovenin dit bestand je <code>firebaseConfig</code> in en laad de pagina opnieuw.
        </div>`;
      return;
    }
    const saved = localStorage.getItem("cadeautjes-me");
    if (saved) {
      try { me = JSON.parse(saved); } catch { me = null; }
    }
    if (me && me.admin) startAdmin();
    else if (me && me.id) startSession();
    else renderLogin();
  }

  // ── Stap 1: naam ─────────────────────────────────────────────
  function renderLogin() {
    currentView = "login";
    setScene(true);
    whoami.innerHTML = "";
    app.innerHTML = `
      <div class="hero">
        <h1>Kerst met de familie</h1>
        <div class="emojis" aria-hidden="true">🎅 🦌 ⛄ 🎁</div>
      </div>
      <h2 class="login-title">Wie doet er mee?</h2>
      <p class="intro">Vul je naam in. Daarna kies je vijf cadeautjes die jij zelf graag zou krijgen en onthul je blind drie cadeautjes die jij voor anderen koopt.</p>
      <form class="panel login-card" id="login-form" novalidate>
        <label for="name">Je naam</label>
        <input id="name" type="text" maxlength="40" autocomplete="given-name" required>
        <p class="hint">Kom je terug? Vul dezelfde naam in, dan ga je verder waar je was.</p>
        <p style="margin-top:20px"><button class="primary" type="submit">Doe mee</button></p>
      </form>`;
    document.getElementById("name").focus();
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const id = slug(name);
      if (!id) { toast("Vul een naam in met minstens één letter of cijfer.", true); return; }
      if (id === "beheerder") {
        me = { id, name: "Beheerder", admin: true };
        localStorage.setItem("cadeautjes-me", JSON.stringify(me));
        startAdmin();
        return;
      }
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      try {
        const ref = doc(db, "participants", id);
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          await setDoc(ref, { name, submitted: false, picks: [], createdAt: serverTimestamp() });
        }
        me = { id, name: snap.exists() ? snap.data().name : name };
        localStorage.setItem("cadeautjes-me", JSON.stringify(me));
        startSession();
      } catch (err) {
        console.error(err);
        toast("Opslaan lukt niet. Controleer je Firebase-configuratie en regels.", true);
        btn.disabled = false;
      }
    });
  }

  function startSession() {
    unsubs.forEach((u) => u());
    unsubs = [];
    myDoc = null;
    items = [];
    phase = "submit";
    participants = [];
    currentView = null;
    setScene(false);
    seenPicks.clear();
    firstPickRender = true;

    whoami.innerHTML = `<span class="muted">${esc(me.name)}</span> · <button class="linklike" id="switch">Niet jij?</button>`;
    document.getElementById("switch").addEventListener("click", () => {
      unsubs.forEach((u) => u());
      unsubs = [];
      localStorage.removeItem("cadeautjes-me");
      me = null;
      renderLogin();
    });

    unsubs.push(onSnapshot(doc(db, "participants", me.id), (snap) => {
      myDoc = snap.exists() ? snap.data() : null;
      update();
    }, onListenError));
    unsubs.push(onSnapshot(collection(db, "items"), (snap) => {
      items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      update();
    }, onListenError));
    unsubs.push(onSnapshot(doc(db, "settings", "game"), (snap) => {
      phase = snap.exists() && snap.data().phase === "pick" ? "pick" : "submit";
      update();
    }, onListenError));
  }

  function onListenError(err) {
    console.error(err);
    toast("Verbinding met de database mislukt.", true);
  }

  function update() {
    if (!me || !myDoc) return;
    if (!myDoc.submitted) {
      if (phase === "pick") renderClosed();
      else if (currentView !== "form") renderForm(); // niet opnieuw tekenen: voorkomt dat getypte tekst verdwijnt
    } else if (isExempt(me.id)) {
      renderExempt();
    } else {
      renderPick();
    }
  }

  function renderClosed() {
    currentView = "closed";
    app.innerHTML = `
      <h1>Het aandragen is gesloten 🔒</h1>
      <p class="intro">De beheerder heeft het kiezen al gestart, dus er kunnen geen nieuwe cadeaus meer bij. Vraag de beheerder of het aandragen nog even heropend kan worden.</p>`;
  }

  // Kaartje met een onthuld cadeau
  function cardHtml(it, isNew, note) {
    const link = safeLink(it.link);
    return `<article class="pick ${isNew ? "reveal" : ""}">
      <div class="t">${esc(it.text)}</div>
      <div>
        <div class="for">🎁 Cadeau voor <strong>${esc(it.ownerName)}</strong></div>
        ${note ? `<div class="for">${note}</div>` : ""}
        <div class="p">${euro(it.price)}</div>
        ${link ? `<a class="buy" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Bekijk cadeau →</a>` : ""}
      </div>
    </article>`;
  }

  const countPips = (n, total = ITEMS_TO_PICK) => Array.from({ length: total }, (_, i) => `<span class="pip ${i < n ? "on" : ""}"></span>`).join("");
  const sumPrice = (list) => list.reduce((t, i) => t + Number(i.price), 0);

  // Deelnemers die zelf niet kiezen (Rosalie en Sander): anderen kopen cadeaus voor hen, dat blijft een verrassing
  function renderExempt() {
    currentView = "exempt";
    const started = phase === "pick" && isDistributed();
    app.innerHTML = `
      <h1>Bedankt, ${esc(me.name)}! 🎅</h1>
      <p class="intro">${started
        ? `Jij hoeft zelf niets te kiezen of te kopen. De anderen zorgen voor jouw ${ITEMS_TO_PICK} cadeaus.`
        : `Je cadeaus zijn opgeslagen. Jij hoeft zelf niets te kiezen of te kopen: de anderen zorgen straks voor jouw ${ITEMS_TO_PICK} cadeaus.`}</p>
      <div class="empty"><div class="big">🎁</div>Laat je verrassen! Wat je krijgt, blijft geheim tot de feestdagen.</div>`;
  }

  // ── Stap 2: vijf cadeaus invoeren ────────────────────────────
  function renderForm() {
    currentView = "form";
    let rows = "";
    for (let i = 1; i <= ITEMS_TO_SUBMIT; i++) {
      rows += `
        <div class="gift-row">
          <label class="row-label" for="t${i}">Cadeau ${i}</label>
          <input id="t${i}" type="text" maxlength="90" placeholder="Bijvoorbeeld: een goede thermosfles" required>
          <div class="price-wrap">
            <span aria-hidden="true">€</span>
            <input id="p${i}" type="number" inputmode="decimal" min="${MIN_PRICE}" max="${MAX_PRICE}" step="0.5" placeholder="${MIN_PRICE}–${MAX_PRICE}" aria-label="Prijs cadeau ${i} in euro" required>
          </div>
          <div class="link-line">
            <input id="l${i}" type="text" inputmode="url" autocapitalize="off" placeholder="Link naar het cadeau (optioneel), plak hier de link" aria-label="Link cadeau ${i}">
          </div>
        </div>`;
    }
    app.innerHTML = `
      <h1>Wat zou jij graag krijgen, ${esc(me.name)}? 🎄</h1>
      <p class="intro">Voer ${ITEMS_TO_SUBMIT} cadeautjes in met een prijs tussen € ${MIN_PRICE} en € ${MAX_PRICE}. Er worden er precies ${ITEMS_TO_PICK} van gekozen: wie een cadeau trekt, ziet dat het van jou komt en koopt het voor je. Je kunt deze lijst achteraf niet meer aanpassen.</p>
      <form class="panel" id="gift-form" novalidate>
        ${rows}
        <p><button class="primary" type="submit">Cadeaus opslaan</button></p>
      </form>`;
    document.getElementById("t1").focus();

    document.getElementById("gift-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const entries = [];
      for (let i = 1; i <= ITEMS_TO_SUBMIT; i++) {
        const text = document.getElementById("t" + i).value.trim();
        const price = parseFloat(String(document.getElementById("p" + i).value).replace(",", "."));
        if (!text) { toast(`Cadeau ${i}: beschrijf het cadeau.`, true); document.getElementById("t" + i).focus(); return; }
        if (!Number.isFinite(price) || price < MIN_PRICE || price > MAX_PRICE) {
          toast(`Cadeau ${i}: de prijs moet tussen € ${MIN_PRICE} en € ${MAX_PRICE} liggen.`, true);
          document.getElementById("p" + i).focus();
          return;
        }
        let link = document.getElementById("l" + i).value.trim();
        if (link) {
          if (!/^https?:\/\//i.test(link)) link = "https://" + link;
          link = safeLink(link);
          if (!link) { toast(`Cadeau ${i}: dit is geen geldige link.`, true); document.getElementById("l" + i).focus(); return; }
        }
        entries.push({ text, price: Math.round(price * 100) / 100, link: link || null });
      }
      const btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true;
      try {
        const batch = writeBatch(db);
        entries.forEach((en) => {
          const ref = doc(collection(db, "items"));
          batch.set(ref, {
            text: en.text,
            price: en.price,
            link: en.link,
            ownerId: me.id,
            ownerName: me.name,
            claimedById: null,
            claimedByName: null,
            claimedAt: null,
            createdAt: serverTimestamp()
          });
        });
        batch.set(doc(db, "participants", me.id), { submitted: true, submittedAt: serverTimestamp() }, { merge: true });
        await batch.commit();
        toast("Je cadeaus zijn opgeslagen.");
      } catch (err) {
        console.error(err);
        toast("Opslaan mislukt. Probeer het opnieuw.", true);
        btn.disabled = false;
      }
    });
  }

  // ── Stap 3: cadeaus onthullen ────────────────────────────────
  function renderPick() {
    currentView = "pick";
    const sortTiles = (a, b) => hash(a.id + me.id) - hash(b.id + me.id);
    const tiles = items.filter((i) => i.revealerId === me.id).sort(sortTiles);
    const extra = tiles.filter((i) => isExempt(i.ownerId)); // extra cadeaus voor deelnemers die zelf niet kiezen
    const own = tiles.filter((i) => !isExempt(i.ownerId));
    const ownDone = own.filter((i) => i.claimedById);
    const extraDone = extra.filter((i) => i.claimedById);
    const allDone = tiles.length > 0 && tiles.every((i) => i.claimedById);
    const waiting = phase !== "pick";
    const contributors = new Set(items.map((i) => i.ownerId)).size;

    const reveal = (it, note) => {
      const isNew = !seenPicks.has(it.id) && !firstPickRender;
      seenPicks.add(it.id);
      return cardHtml(it, isNew, note);
    };
    const tile = (it, isExtra) => {
      const filler = FILLER[hash(it.id) % FILLER.length];
      return `<button class="tile ${isExtra ? "extra" : ""} ${busyItem === it.id ? "busy" : ""}" data-id="${esc(it.id)}" aria-label="Onthul een cadeau">
        <div class="fuzzy" aria-hidden="true">
          <div class="t">${esc(filler)}</div>
          <div class="p">€ 00,00</div>
        </div>
        <span class="ico" aria-hidden="true">${ICONS[hash(it.id + "i") % ICONS.length]}</span>
        <span class="tag">Tik om te onthullen</span>
      </button>`;
    };

    let body;
    if (waiting) {
      body = `<div class="empty"><div class="big">☕</div>Het kiezen is nog niet begonnen. Zodra de beheerder het kiezen start, verschijnen hier je cadeaus. Deze pagina werkt zichzelf bij, je hoeft niets te doen.<br><br><strong>${contributors}</strong> ${contributors === 1 ? "deelnemer heeft" : "deelnemers hebben"} tot nu toe cadeaus aangedragen.</div>`;
    } else if (!tiles.length) {
      body = `<div class="empty"><div class="big">🤔</div>Voor jou zijn geen cadeaus verdeeld. Waarschijnlijk heb je je cadeaus aangedragen nadat het kiezen was gestart. Vraag het de beheerder.</div>`;
    } else {
      const ownRows = ownDone.map((it) => reveal(it, "")).join("");
      const extraRows = extraDone.map((it) => reveal(it, "")).join("");
      body = `
        ${ownDone.length ? `<section class="block"><div class="head"><h2>Jouw cadeaus</h2>${allDone ? `<span class="muted">Totaal van al je cadeaus: ${euro(sumPrice(tiles))}</span>` : ""}</div><div class="picks">${ownRows}</div></section>` : ""}
        ${own.length > ownDone.length ? `<section class="block"><div class="head"><h2>Onthul je cadeaus</h2><span class="muted">nog ${own.length - ownDone.length} te onthullen</span></div><div class="grid">${own.filter((i) => !i.claimedById).map((i) => tile(i, false)).join("")}</div></section>` : ""}
        ${extra.length ? `<section class="block"><div class="head"><h2>Extra voor Rosalie of Sander</h2></div>
          <p class="muted" style="margin-bottom:14px">Rosalie en Sander kiezen zelf niet. Daarom koop jij ${extra.length === 1 ? "één extra cadeau" : `${extra.length} extra cadeaus`} voor hen.</p>
          ${extraDone.length ? `<div class="picks" style="margin-bottom:16px">${extraRows}</div>` : ""}
          ${extra.length > extraDone.length ? `<div class="grid">${extra.filter((i) => !i.claimedById).map((i) => tile(i, true)).join("")}</div>` : ""}
        </section>` : ""}
        ${allDone ? `<div class="empty" style="margin-top:32px">Alles onthuld. Fijne feestdagen! 🎄</div>` : ""}`;
    }
    firstPickRender = false;

    app.innerHTML = `
      <h1>${allDone ? "Jouw cadeaus 🎁" : waiting ? "Nog even wachten ☕" : "Kies blind 🎅"}</h1>
      <p class="intro">${waiting
        ? "Je cadeaus zijn opgeslagen. Je kunt kiezen zodra iedereen zijn cadeaus heeft aangedragen en de beheerder het kiezen start."
        : allDone
          ? "Dit zijn de cadeaus die jij hebt getrokken, met erbij voor wie je ze koopt."
          : `Tik op een vervaagd cadeau om te zien wat het is en voor wie je het koopt. De cadeaus zijn zo verdeeld dat iedereen ongeveer evenveel betaalt.`}</p>
      ${waiting || !tiles.length ? "" : `<div class="counter" aria-label="${ownDone.length + extraDone.length} van ${tiles.length} onthuld">${countPips(ownDone.length + extraDone.length, tiles.length)}<span class="muted" style="margin-left:6px">${ownDone.length + extraDone.length} van ${tiles.length} onthuld</span></div>`}
      ${body}`;

    app.querySelectorAll(".tile").forEach((btn) => btn.addEventListener("click", () => reveal_(btn.dataset.id)));
  }

  async function reveal_(itemId) {
    if (busyItem) return;
    busyItem = itemId;
    renderPick();
    try {
      await runTransaction(db, async (tx) => {
        const itemRef = doc(db, "items", itemId);
        const settingsSnap = await tx.get(doc(db, "settings", "game"));
        const snap = await tx.get(itemRef);

        if (!settingsSnap.exists() || settingsSnap.data().phase !== "pick") throw new Error("Het kiezen is nog niet begonnen.");
        if (!snap.exists()) throw new Error("Dit cadeau bestaat niet meer.");
        const it = snap.data();
        if (it.revealerId !== me.id || !it.assignedToId) throw new Error("Dit cadeau is niet voor jou om te onthullen.");
        if (it.claimedById) throw new Error("Dit cadeau is al onthuld.");

        tx.update(itemRef, {
          claimedById: it.assignedToId,      // wie het cadeau koopt
          claimedByName: it.assignedToName,
          pickedById: me.id,                 // wie het cadeau heeft gekozen/onthuld
          pickedByName: me.name,
          claimedAt: serverTimestamp()
        });
      });
    } catch (err) {
      console.error(err);
      toast(err.message || "Onthullen mislukt. Probeer het opnieuw.", true);
    } finally {
      busyItem = null;
      if (myDoc && myDoc.submitted && !isExempt(me.id)) renderPick();
    }
  }

  // ── Beheerder ────────────────────────────────────────────────
  let participants = [];
  const RESET = {
    assignedToId: null, assignedToName: null, revealerId: null, revealerName: null,
    claimedById: null, claimedByName: null, pickedById: null, pickedByName: null, claimedAt: null
  };

  function startAdmin() {
    unsubs.forEach((u) => u());
    unsubs = [];
    items = [];
    participants = [];
    phase = "submit";
    currentView = "admin";
    setScene(false);
    whoami.innerHTML = `<span class="muted">Beheerder</span> · <button class="linklike" id="switch">Uitloggen</button>`;
    document.getElementById("switch").addEventListener("click", () => {
      unsubs.forEach((u) => u());
      unsubs = [];
      localStorage.removeItem("cadeautjes-me");
      me = null;
      renderLogin();
    });
    unsubs.push(onSnapshot(collection(db, "participants"), (snap) => {
      participants = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderAdmin();
    }, onListenError));
    unsubs.push(onSnapshot(collection(db, "items"), (snap) => {
      items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderAdmin();
    }, onListenError));
    unsubs.push(onSnapshot(doc(db, "settings", "game"), (snap) => {
      phase = snap.exists() && snap.data().phase === "pick" ? "pick" : "submit";
      renderAdmin();
    }, onListenError));
  }

  function renderAdmin() {
    if (!me || !me.admin) return;
    const byName = (a, b) => String(a.name || a.ownerName || "").localeCompare(String(b.name || b.ownerName || ""), "nl");
    const people = [...participants].sort(byName);
    const allItems = [...items].sort((a, b) => byName(a, b) || String(a.text).localeCompare(String(b.text), "nl"));
    const distributed = isDistributed();
    const revealedCount = items.filter((i) => i.claimedById).length;
    const notSubmitted = people.filter((p) => !p.submitted);

    // Totaal per koper
    const totalsRows = people.map((p) => {
      const buys = items.filter((i) => i.assignedToId === p.id);
      return { p, n: buys.length, sum: sumPrice(buys) };
    }).filter((r) => r.n > 0);
    const sums = totalsRows.map((r) => r.sum);
    const avg = sums.length ? sums.reduce((a, b) => a + b, 0) / sums.length : 0;
    const spread = sums.length ? Math.max(...sums) - Math.min(...sums) : 0;

    const peopleRows = people.map((p) => {
      const given = items.filter((i) => i.ownerId === p.id);
      const buys = items.filter((i) => i.assignedToId === p.id);
      const givenHtml = given.length
        ? `<ul>${given.map((i) => `<li>${esc(i.text)} (${euro(i.price)})${distributed ? (i.assignedToName ? ` <span class="muted">→ koopt ${esc(i.assignedToName)}${i.claimedById ? "" : ", nog niet onthuld"}</span>` : ` <span class="muted">→ niet gekozen</span>`) : ""}</li>`).join("")}</ul>`
        : `<span class="muted">geen</span>`;
      const buysHtml = buys.length
        ? `<ul>${buys.map((i) => `<li>${esc(i.text)} (${euro(i.price)}) <span class="muted">← van ${esc(i.ownerName)}${i.claimedById ? ", onthuld" : ", nog niet onthuld"}</span></li>`).join("")}</ul><span class="muted">Totaal ${euro(sumPrice(buys))}</span>`
        : `<span class="muted">${isExempt(p.id) ? "koopt zelf niets" : distributed ? "geen" : "nog niet verdeeld"}</span>`;
      return `<tr>
        <td><strong>${esc(p.name)}</strong>${p.submitted ? "" : `<br><span class="muted">nog geen cadeaus ingevoerd</span>`}${isExempt(p.id) ? `<br><span class="muted">kiest zelf niet</span>` : ""}</td>
        <td>${givenHtml}</td>
        <td>${buysHtml}</td>
        <td><button class="danger" data-del-user="${esc(p.id)}">Verwijder</button></td>
      </tr>`;
    }).join("");

    const itemRows = allItems.map((i) => `<tr>
      <td>${esc(i.text)}${safeLink(i.link) ? ` <a href="${esc(safeLink(i.link))}" target="_blank" rel="noopener noreferrer">link</a>` : ""}</td>
      <td>${euro(i.price)}</td>
      <td>${esc(i.ownerName)}</td>
      <td>${i.assignedToName ? esc(i.assignedToName) : `<span class="muted">${distributed ? "niet gekozen" : "–"}</span>`}</td>
      <td>${i.claimedById ? "ja" : i.assignedToId ? `<span class="muted">nog niet</span>` : `<span class="muted">–</span>`}</td>
      <td><button class="danger" data-del-item="${esc(i.id)}">Verwijder</button></td>
    </tr>`).join("");

    app.innerHTML = `
      <h1>Beheer 🎅</h1>
      <div class="panel phase">
        <div>
          <strong>Fase: ${phase === "pick" ? "kiezen is gestart" : "cadeaus aandragen"}</strong>
          <p class="muted" style="margin-top:4px">${phase === "pick"
            ? `Iedereen ontvangt ${ITEMS_TO_PICK} cadeaus. Verschil tussen het hoogste en laagste totaal van de kopers: ${euro(spread)}.`
            : notSubmitted.length
              ? `Nog niet aangedragen (${notSubmitted.length}): ${notSubmitted.map((p) => esc(p.name)).join(", ")}. Zij doen niet mee als je nu verdeelt.`
              : participants.length ? "Iedereen heeft cadeaus aangedragen." : "Nog geen deelnemers."}</p>
        </div>
        ${phase === "pick"
          ? `<button class="secondary" data-phase="submit">Terug naar aandragen</button>`
          : `<button class="primary" data-phase="pick">Verdeel en start het kiezen</button>`}
      </div>
      <div class="stats">
        <span><strong>${participants.length}</strong> deelnemers</span>
        <span><strong>${items.length}</strong> cadeaus</span>
        <span><strong>${revealedCount}</strong> onthuld</span>
      </div>

      ${distributed ? `<section class="block">
        <div class="head"><h2>Totaal per persoon</h2><span class="muted">gemiddeld ${euro(avg)}, verschil ${euro(spread)}</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Naam</th><th>Cadeaus</th><th>Totaal</th><th>Ten opzichte van gemiddeld</th></tr></thead>
          <tbody>${totalsRows.map((r) => `<tr><td>${esc(r.p.name)}</td><td>${r.n}</td><td>${euro(r.sum)}</td><td>${r.sum - avg >= 0 ? "+" : "−"} ${euro(Math.abs(r.sum - avg))}</td></tr>`).join("")}</tbody>
        </table></div>
      </section>` : ""}

      <section class="block">
        <div class="head"><h2>Deelnemers</h2></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Naam</th><th>Heeft aangedragen</th><th>Koopt</th><th></th></tr></thead>
          <tbody>${peopleRows || `<tr><td colspan="4" class="muted">Nog geen deelnemers.</td></tr>`}</tbody>
        </table></div>
      </section>

      <section class="block">
        <div class="head"><h2>Alle cadeaus</h2></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Cadeau</th><th>Prijs</th><th>Aangedragen door</th><th>Koopt</th><th>Onthuld</th><th></th></tr></thead>
          <tbody>${itemRows || `<tr><td colspan="6" class="muted">Nog geen cadeaus.</td></tr>`}</tbody>
        </table></div>
      </section>`;

    app.querySelectorAll("[data-phase]").forEach((b) => b.addEventListener("click", () => (b.dataset.phase === "pick" ? startPick() : backToSubmit())));
    app.querySelectorAll("[data-del-user]").forEach((b) => b.addEventListener("click", () => deleteUser(b.dataset.delUser)));
    app.querySelectorAll("[data-del-item]").forEach((b) => b.addEventListener("click", () => deleteItem(b.dataset.delItem)));
  }

  // Verdeel de cadeaus en start het kiezen
  async function startPick() {
    const buyers = participants.filter((p) => p.submitted).map((p) => ({ id: p.id, name: p.name }))
      .sort((a, b) => a.name.localeCompare(b.name, "nl"));
    const missing = participants.filter((p) => !p.submitted);
    if (items.length > 480) { toast("Te veel cadeaus om in één keer te verdelen.", true); return; }
    const exempt = NO_PICK.filter((id) => buyers.some((b) => b.id === id));
    const res = computeDistribution(items.map((i) => ({ id: i.id, ownerId: i.ownerId, price: Number(i.price) })), buyers, ITEMS_TO_PICK, exempt);
    if (res.error) { toast(res.error, true); return; }

    const sums = Object.values(res.totals);
    const min = Math.min(...sums), max = Math.max(...sums);
    const exemptNames = buyers.filter((b) => exempt.includes(b.id)).map((b) => b.name).join(" en ");
    const msg = `Verdeling gemaakt: iedereen ontvangt ${ITEMS_TO_PICK} cadeaus. ${buyers.length - exempt.length} deelnemers kopen er elk ${ITEMS_TO_PICK}` +
      (exemptNames ? `, plus een extra cadeau voor ${exemptNames}` : "") + `.\n\n` +
      `Totaal per koper: van ${euro(min)} tot ${euro(max)} (verschil ${euro(max - min)}).` +
      (missing.length ? `\n\nLet op: ${missing.map((p) => p.name).join(", ")} ${missing.length === 1 ? "heeft" : "hebben"} nog niets aangedragen en ${missing.length === 1 ? "doet" : "doen"} niet mee.` : "") +
      `\n\nHet kiezen starten? Met Annuleren krijg je bij een volgende poging een nieuwe verdeling.`;
    if (!confirm(msg)) return;

    try {
      const byItem = new Map(res.assignments.map((a) => [a.itemId, a]));
      const nameOf = Object.fromEntries(buyers.map((b) => [b.id, b.name]));
      const batch = writeBatch(db);
      items.forEach((it) => {
        const a = byItem.get(it.id);
        batch.update(doc(db, "items", it.id), a
          ? { ...RESET, assignedToId: a.buyerId, assignedToName: nameOf[a.buyerId], revealerId: a.revealerId, revealerName: nameOf[a.revealerId] }
          : { ...RESET });
      });
      batch.set(doc(db, "settings", "game"), { phase: "pick", distributedAt: serverTimestamp(), updatedAt: serverTimestamp() }, { merge: true });
      await batch.commit();
      toast("De cadeaus zijn verdeeld en het kiezen is gestart.");
    } catch (err) {
      console.error(err);
      toast("Starten mislukt.", true);
    }
  }

  function resetAll(batch, exceptIds) {
    items.filter((i) => !exceptIds.has(i.id)).forEach((i) => batch.update(doc(db, "items", i.id), { ...RESET }));
    batch.set(doc(db, "settings", "game"), { phase: "submit", updatedAt: serverTimestamp() }, { merge: true });
  }

  async function backToSubmit() {
    if (!confirm("Terug naar aandragen?\n\nDe verdeling en alle onthulde cadeaus worden gewist. Als je het kiezen opnieuw start, krijg je een nieuwe verdeling.")) return;
    try {
      const batch = writeBatch(db);
      resetAll(batch, new Set());
      await batch.commit();
      toast("Teruggezet naar aandragen.");
    } catch (err) {
      console.error(err);
      toast("Wijzigen mislukt.", true);
    }
  }

  const RESET_WARNING = "\n\nLet op: de verdeling is al gemaakt. Na het verwijderen wordt de verdeling gewist en moet je het kiezen opnieuw starten.";

  async function deleteItem(itemId) {
    const it = items.find((i) => i.id === itemId);
    if (!it) return;
    const distributed = isDistributed();
    if (!confirm(`Cadeau "${it.text}" van ${it.ownerName} verwijderen?` + (distributed ? RESET_WARNING : ""))) return;
    try {
      const batch = writeBatch(db);
      batch.delete(doc(db, "items", itemId));
      if (distributed) resetAll(batch, new Set([itemId]));
      await batch.commit();
      toast("Cadeau verwijderd.");
    } catch (err) {
      console.error(err);
      toast("Verwijderen mislukt.", true);
    }
  }

  async function deleteUser(userId) {
    const p = participants.find((x) => x.id === userId);
    if (!p) return;
    const owned = items.filter((i) => i.ownerId === userId);
    const distributed = isDistributed();
    if (!confirm(`${p.name} verwijderen?\n\n${owned.length} aangedragen cadeaus worden ook verwijderd.` + (distributed ? RESET_WARNING : ""))) return;
    try {
      const batch = writeBatch(db);
      batch.delete(doc(db, "participants", userId));
      owned.forEach((it) => batch.delete(doc(db, "items", it.id)));
      if (distributed) resetAll(batch, new Set(owned.map((i) => i.id)));
      await batch.commit();
      toast(`${p.name} is verwijderd.`);
    } catch (err) {
      console.error(err);
      toast("Verwijderen mislukt.", true);
    }
  }

  boot();
</script>
</body>
</html>
