<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beveiligde Live Blinde Lijst</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-color: #ffffff;
            --primary-color: #6c5ce7;
            --text-color: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
        }

        /* Inlogscherm stijlen */
        #authSection {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 350px;
            margin: 0 auto;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .primary-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Hoofd-app stijlen (standaard verborgen) */
        #mainApp {
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .blind-item {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 20px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .blind-item:disabled {
            background-color: #b2bec3;
            cursor: not-allowed;
        }

        .reveal-box {
            background: #ffeaa7;
            border: 2px dashed #fdcb6e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .revealed-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 15px 0;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- INLOGSCHERM -->
    <div id="authSection">
        <h1>Inloggen 🔒</h1>
        <p style="text-align: center; color: #636e72; font-size: 0.9rem;">Voer je e-mail en wachtwoord in om toegang te krijgen tot de lijst.</p>
        <input type="email" id="emailInput" placeholder="E-mailadres">
        <input type="password" id="passwordInput" placeholder="Wachtwoord">
        <button class="primary-btn" id="loginBtn">Log in</button>
        <p id="authError" style="color: red; font-size: 0.9rem; text-align: center;"></p>
    </div>

    <!-- HOOFD APPLICATIE -->
    <div id="mainApp">
        <button class="logout-btn" id="logoutBtn">Uitloggen</button>
        <h1>Live Blinde Lijst 🌐</h1>
        <p style="color: #636e72; text-align: center;">Kies blind een optie. Dit wordt live voor iedereen vergrendeld.</p>
        
        <div class="grid" id="buttonGrid"></div>

        <div class="reveal-box" id="revealBox">
            <h2>Jouw geheime item:</h2>
            <div class="revealed-text" id="revealedText"></div>
            <p style="font-size: 0.85rem; color: #2d3436;"><em>Schrijf dit direct op. Zodra je dit sluit, is het weg!</em></p>
            <button class="primary-btn" style="background:#2d3436; padding: 8px 16px;" onclick="closeReveal()">Ik heb het genoteerd</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, onValue, runTransaction } from "https://gstatic.com";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://gstatic.com";

    // 1. PLAK HIER JOUW CONFIGURATIE (Zichtbaar in browser, maar beveiligd via Database Rules)
const firebaseConfig = {
  apiKey: "AIzaSyB7ZA9dBU8wAElR3rMt2Rf607sFsmR1WXI",
  authDomain: "kerstlijstje-f45c3.firebaseapp.com",
  projectId: "kerstlijstje-f45c3",
  storageBucket: "kerstlijstje-f45c3.firebasestorage.app",
  messagingSenderId: "1065905360166",
  appId: "1:1065905360166:web:1bd05b667e4f6ae4f385e7"
};

    const databaseLijst = [
        "Item A: Weekendje weg",
        "Item B: Luxe diner",
        "Item C: Bioscoopbon",
        "Item D: Dagje sauna",
        "Item E: Parachutesprong"
    ];

    // Initialiseer Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const geclaimdRef = ref(db, 'geclaimdeItems');

    // DOM Elementen
    const authSection = document.getElementById('authSection');
    const mainApp = document.getElementById('mainApp');
    const buttonGrid = document.getElementById('buttonGrid');
    const revealBox = document.getElementById('revealBox');
    const revealedText = document.getElementById('revealedText');
    const authError = document.getElementById('authError');

    // --- AUTHENTICATIE LOGICA ---
    
    // Inloggen knop
    document.getElementById('loginBtn').addEventListener('click', () => {
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        
        signInWithEmailAndPassword(auth, email, password)
            .then(() => { authError.innerText = ""; })
            .catch((error) => { authError.innerText = "Inloggen mislukt: " + error.message; });
    });

    // Uitloggen knop
    document.getElementById('logoutBtn').addEventListener('click', () => {
        signOut(auth);
    });

    // Controleren of gebruiker ingelogd is of van status verandert
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Gebruiker is ingelogd -> toon app, verberg login
            authSection.style.display = 'none';
            mainApp.style.display = 'block';
            
            // Start het live luisteren naar de database
            onValue(geclaimdRef, (snapshot) => {
                const geclaimdeIndexen = snapshot.val() || [];
                bouwLijst(geclaimdeIndexen);
            });
        } else {
            // Gebruiker is niet ingelogd -> toon login, verberg app
            authSection.style.display = 'flex';
            mainApp.style.display = 'none';
            buttonGrid.innerHTML = '';
        }
    });

    // --- LIJST LOGICA ---
    function bouwLijst(geclaimdeIndexen) {
        buttonGrid.innerHTML = '';
        databaseLijst.forEach((item, index) => {
            const btn = document.createElement('button');
            btn.className = 'blind-item';
            btn.innerText = `Optie ${index + 1}`;
            
            if (geclaimdeIndexen.includes(index)) {
                btn.innerText = "Geclaimd 🔒";
                btn.disabled = true;
            } else {
                btn.onclick = () => claimItem(index);
            }
            buttonGrid.appendChild(btn);
        });
    }

    function claimItem(index) {
        runTransaction(geclaimdRef, (huidigeLijst) => {
            if (!huidigeLijst) huidigeLijst = [];
            if (huidigeLijst.includes(index)) {
                alert("Helaas! Iemand anders was je net voor.");
                return huidigeLijst;
            }
            huidigeLijst.push(index);
            
            revealedText.innerText = databaseLijst[index];
            revealBox.style.display = 'block';
            revealBox.scrollIntoView({ behavior: 'smooth' });

            return huidigeLijst;
        });
    }

    window.closeReveal = function() {
        revealBox.style.display = 'none';
        revealedText.innerText = '';
    }
</script>
</body>
</html>
